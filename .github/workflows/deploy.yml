# 工作流的名称
name: hugo-deploy

# 触发事件
on:
  # 当你向主分支 main 推送了代码时触发此工作流
  push:
    paths-ignore:
      - "images/**"
      - "LICENSE"
      - "README.md"
    branches:
      - main
  workflow_dispatch:

# 同一时间只跑一个部署，避免连续两次推送时旧构建覆盖新构建
concurrency:
  group: hugo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          ref: main
          submodules: true
          fetch-depth: 1

      - name: Get Theme
        run: git submodule update --init --recursive

      - name: Update theme to Latest commit
        run: git submodule update --remote

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Stack 主题用 SCSS（toCSS/libsass），必须用 extended 版 Hugo
          hugo-version: '0.157.0'
          extended: true

      - name: Build
        # --buildFuture: 避免因 front matter 时区写错（日期比构建时间晚）导致新文章被 Hugo 丢弃
        # --cleanDestinationDir: 清掉 public/ 中残留的旧文件，避免把历史构建产物一起发布
        run: hugo --theme=hugo-theme-stack --gc --minify --buildFuture --cleanDestinationDir

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public





